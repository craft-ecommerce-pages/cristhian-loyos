# PLANTILLA del Worker del panel — cuenta Cloudflare del cliente.
# NO desplegar este archivo directamente: `scripts/deploy-client.sh` sustituye los marcadores
# ${...} con variables/secrets y escribe la configuración real en panel/.wrangler/client.toml.
#
# Aislamiento: KV, D1 y R2 son de la cuenta del cliente. Sin IDs de Craft, sin service binding
# LOYALTY (no existe en esta cuenta) y sin URLs del CRM de Craft.
# `workers_dev = true` para el panel y el menú; no se declaran rutas ni wildcards.

name = "${PANEL_WORKER_NAME}"
main = "../src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

[vars]
# Mismo slug que el Worker de menú: resuelve el host (workers.dev o dominio propio) a sus datos.
CLIENT_SLUG = "${CLIENT_SLUG}"
MENU_PUBLIC_URL = "${MENU_PUBLIC_URL}"
MEDIA_ORIGIN = "${MEDIA_ORIGIN}"
# Bendo (tarjeta, link hospedado): disabled | mock | live. staging | production
# eligen idp/api de Geopagos. BENDO_POINT_OF_SALE vacío = se resuelve con
# GET /api/v4/points-of-sale (cache KV 24 h); nunca se envía una cadena vacía.
BENDO_MODE = "${BENDO_MODE}"
BENDO_ENV = "${BENDO_ENV}"
BENDO_POINT_OF_SALE = "${BENDO_POINT_OF_SALE}"

# KV compartido con el Worker de menú: el panel es dueño del catálogo tras "Entregar".
[[kv_namespaces]]
binding = "MENUS"
id = "${KV_MENUS_ID}"

# D1 propio del panel en la cuenta del cliente. Migraciones en panel/migrations (se aplican en orden).
[[d1_databases]]
binding = "DB"
database_name = "${D1_DATABASE_NAME}"
database_id = "${D1_DATABASE_ID}"
migrations_dir = "../migrations"

# R2 de la cuenta del cliente para media del catálogo (bucket privado; se publica por dominio propio).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "${R2_BUCKET_NAME}"

# Copia pública de las fotos (solo `media/panel/...`, nunca `private/`), servida por
# MEDIA_ORIGIN (dominio propio de R2). Las subidas del panel escriben en ambos.
[[r2_buckets]]
binding = "MEDIA_PUBLIC"
bucket_name = "${R2_BUCKET_NAME}-public"

# Durable Object del tiempo real (caja/cocina): una instancia por sede. SQLite
# (obligatorio en el plan gratis de Cloudflare). La migración `v1-orders-hub` ya
# aplicada no se edita: para cambiar la clase se añade un tag nuevo.
[[durable_objects.bindings]]
name = "ORDERS_HUB"
class_name = "OrdersHub"

[[migrations]]
tag = "v1-orders-hub"
new_sqlite_classes = ["OrdersHub"]

# Rate limit del login. El namespace es un ID numérico de la cuenta del cliente.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "${RATELIMIT_NAMESPACE_ID}"
simple = { limit = 10, period = 60 }

# Cron cada minuto: reconsulta los links de Bendo `pending/unknown` de las
# últimas 2 h sin recobrar. El handler `scheduled` vive en src/index.js.
[triggers]
crons = ["* * * * *"]

# Secrets (wrangler secret put; los aplica el workflow con SESSION_SECRET y ADMIN_TOKEN):
# SESSION_SECRET, ADMIN_TOKEN, BENDO_CLIENT_ID, BENDO_CLIENT_SECRET.
# LOYALTY_ADMIN_TOKEN solo si algún día se despliega el club.

# Workers Logs (gratis, 3 días en Cloudflare); nas los copia cada 5 min y guarda 7 días.
[observability]
enabled = true
